<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>光之巨人 · 怪兽讨伐战 3D</title>
<meta name="description" content="纯 WebGL 程序化生成的 3D 巨人打怪兽动作游戏：连击、必杀光线、光轮、可破坏城市、Boss 战。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23c8102e'/><circle cx='50' cy='50' r='22' fill='%2339d0ff'/></svg>">
<style>
:root{--c1:#39d0ff;--c2:#ff3b4e;--c3:#ffd34d;--bg:#05060c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
.panel{position:absolute;left:18px;top:16px;width:min(360px,46vw)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;letter-spacing:1px}
.row b{width:34px;text-shadow:0 0 6px #000}
.bar{flex:1;height:13px;background:#0009;border:1px solid #fff5;transform:skewX(-18deg);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .12s}
#hp i{background:linear-gradient(90deg,#ff3b4e,#ffb14d)}
#en i{background:linear-gradient(90deg,#1b7bff,#39d0ff,#b9f3ff)}
#timer{width:38px;height:38px;border-radius:50%;border:3px solid #cfd6e4;background:radial-gradient(circle at 35% 30%,#fff,#39d0ff 45%,#0a3a8a);box-shadow:0 0 18px #39d0ff;flex:none}
#timer.low{background:radial-gradient(circle at 35% 30%,#fff,#ff3b4e 45%,#6a0010);box-shadow:0 0 22px #ff3b4e;animation:blink .45s infinite}
@keyframes blink{50%{opacity:.25}}
.top{position:absolute;right:18px;top:14px;text-align:right;text-shadow:0 2px 8px #000}
.top .score{font-size:30px;font-weight:900;font-style:italic;letter-spacing:2px}
.top small{display:block;font-size:12px;opacity:.75;letter-spacing:2px}
#wave{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:13px;letter-spacing:4px;padding:5px 18px;background:#0008;border:1px solid #fff3;transform-origin:center;white-space:nowrap}
#combo{position:absolute;right:26px;top:36%;font-size:54px;font-weight:900;font-style:italic;color:var(--c3);text-shadow:0 0 18px #ff8a00,0 3px 0 #000;opacity:0;transition:opacity .3s}
#combo small{font-size:16px;display:block;text-align:right;letter-spacing:3px}
#combo.pop{animation:pop .18s}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(28px,6vw,64px);font-weight:900;font-style:italic;letter-spacing:8px;text-shadow:0 0 24px var(--c1),0 4px 0 #000;opacity:0;pointer-events:none}
#banner.show{animation:banner 2.6s ease-out}
#banner small{display:block;font-size:.3em;letter-spacing:10px;color:var(--c3);margin-top:6px}
@keyframes banner{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#ff0020 130%);opacity:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#map{position:absolute;right:18px;bottom:18px;width:150px;height:150px;border-radius:50%;border:2px solid #fff4;background:#000a}
#bars div{position:absolute;width:90px;height:7px;margin-left:-45px;background:#000a;border:1px solid #fff6;transform:skewX(-18deg)}
#bars div i{display:block;height:100%;background:linear-gradient(90deg,#ff2d55,#ff9f0a);transform-origin:left}
#bars div span{position:absolute;left:0;right:0;top:-17px;text-align:center;font-size:11px;letter-spacing:2px;transform:skewX(18deg);text-shadow:0 1px 4px #000;white-space:nowrap}
#bars div.boss{width:160px;margin-left:-80px;height:9px}
.dmg{position:absolute;font-weight:900;font-style:italic;font-size:22px;color:#fff;text-shadow:0 0 8px #ff8a00,0 2px 0 #000;animation:dmg .8s ease-out forwards;pointer-events:none}
.dmg.crit{font-size:34px;color:var(--c3)}
.dmg.hurt{color:#ff5a6a}
.dmg.heal{color:#7dffb0}
@keyframes dmg{0%{transform:translate(-50%,0) scale(1.5)}100%{transform:translate(-50%,-70px) scale(.9);opacity:0}}
#help{position:absolute;left:18px;bottom:16px;font-size:12px;line-height:1.9;opacity:.72;text-shadow:0 1px 4px #000}
kbd{display:inline-block;min-width:20px;padding:0 5px;margin-right:3px;border:1px solid #fff7;border-radius:4px;background:#0008;font:11px/17px ui-monospace,Consolas,monospace;text-align:center}
#fps{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font:10px ui-monospace,monospace;opacity:.4}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#0b1a3acc,#02030add 70%);backdrop-filter:blur(3px);transition:opacity .5s;z-index:5;padding:20px}
.screen.hide{opacity:0;pointer-events:none}
h1{font-size:clamp(34px,8vw,92px);font-weight:900;font-style:italic;letter-spacing:.08em;line-height:1.05;background:linear-gradient(180deg,#fff 20%,#9fe8ff 50%,#ff3b4e 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px #39d0ff88)}
h2{font-size:clamp(11px,2vw,16px);letter-spacing:.8em;margin:10px 0 28px;color:#9fe8ff;font-weight:400}
.btn{pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:900;font-size:20px;font-style:italic;letter-spacing:6px;color:#fff;padding:16px 46px;margin:6px;border:2px solid #fff;background:linear-gradient(90deg,#c8102e,#ff3b4e);transform:skewX(-14deg);box-shadow:0 0 30px #ff3b4e88;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:skewX(-14deg) scale(1.06);box-shadow:0 0 46px #ff3b4e}
.btn.alt{background:#0008;border-color:#fff6;box-shadow:none;font-size:14px;padding:12px 26px}
.tips{margin-top:26px;font-size:13px;line-height:2.1;opacity:.85;max-width:720px}
.stat{font-size:15px;line-height:2;margin:14px 0 22px;letter-spacing:2px}
.rank{font-size:110px;font-weight:900;font-style:italic;color:var(--c3);text-shadow:0 0 40px #ff8a00;line-height:1}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05060c;z-index:9;letter-spacing:6px;font-size:14px;transition:opacity .6s}
#load.hide{opacity:0;pointer-events:none}
#touch{position:fixed;inset:0;display:none;pointer-events:none}
.touch #touch{display:block}.touch #help{display:none}.touch #map{bottom:auto;top:70px;width:96px;height:96px}
#stick{position:absolute;left:26px;bottom:30px;width:130px;height:130px;border-radius:50%;border:2px solid #fff4;background:#fff1;pointer-events:auto}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#fff5}
.tb{position:absolute;width:62px;height:62px;border-radius:50%;border:2px solid #fff6;background:#0007;color:#fff;font-family:inherit;font-weight:900;font-size:15px;line-height:58px;text-align:center;pointer-events:auto}
.tb:active,.tb.on{background:#39d0ff88}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="vig"></div><div id="flash"></div>
  <div class="panel">
    <div class="row"><div id="timer"></div>
      <div style="flex:1">
        <div class="row"><b>体力</b><div class="bar" id="hp"><i></i></div></div>
        <div class="row" style="margin:0"><b>光能</b><div class="bar" id="en"><i></i></div></div>
      </div>
    </div>
  </div>
  <div id="wave">第 1 波</div>
  <div class="top"><div class="score" id="score">0</div><small id="city">城市完好 100%</small><small id="best"></small></div>
  <div id="combo">0<small>连击</small></div>
  <div id="banner"></div>
  <div id="bars"></div><div id="dmgs"></div>
  <canvas id="map" width="150" height="150"></canvas>
  <div id="help">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>移动　<kbd>鼠标</kbd>视角　<kbd>空格</kbd>跳跃（落地冲击波）　<kbd>Shift</kbd>闪避<br>
    <kbd>J</kbd>/<kbd>左键</kbd>拳击连段　<kbd>K</kbd>飞踢　<kbd>L</kbd>/<kbd>右键</kbd>按住放必杀光线　<kbd>U</kbd>光轮　<kbd>P</kbd>暂停　<kbd>M</kbd>静音
  </div>
  <div id="fps"></div>
</div>

<div id="touch">
  <div id="stick"><i></i></div>
  <div class="tb" data-k="KeyJ" style="right:100px;bottom:36px">拳</div>
  <div class="tb" data-k="KeyK" style="right:26px;bottom:92px">踢</div>
  <div class="tb" data-k="KeyL" style="right:112px;bottom:112px;border-color:#39d0ff">光线</div>
  <div class="tb" data-k="KeyU" style="right:40px;bottom:168px">光轮</div>
  <div class="tb" data-k="Space" style="right:190px;bottom:40px">跳</div>
  <div class="tb" data-k="ShiftLeft" style="right:186px;bottom:120px">闪</div>
</div>

<div class="screen" id="menu">
  <h1>光之巨人</h1>
  <h2>怪兽讨伐战 · ULTRA KAIJU BATTLE 3D</h2>
  <div><button class="btn" id="start">变身出击</button></div>
  <div><button class="btn alt" id="demo">观战模式（AI 自动战斗）</button></div>
  <div class="tips">
    怪兽群正在袭击夜幕下的都市。化身 40 米的光之巨人，用拳脚、光轮与必杀光线将它们全部击退！<br>
    5 波怪兽 · 最终 Boss「冥帝兽」 · 胸口计时器变红闪烁代表体力告急 · 击倒怪兽会掉落光球回复体力与光能
  </div>
</div>
<div class="screen hide" id="end">
  <h1 id="endTitle">胜利</h1>
  <div class="rank" id="rank">S</div>
  <div class="stat" id="endStat"></div>
  <button class="btn" id="again">再战一次</button>
</div>
<div class="screen hide" id="pause"><h1 style="font-size:60px">暂停</h1><h2>按 P 或点击继续</h2></div>
<div id="load">光能充填中…</div>

<script type="module" src="./game.js"></script>
<script>
window.addEventListener('error',e=>{const l=document.getElementById('load');if(l&&!l.classList.contains('hide'))l.textContent='加载失败：'+(e.message||'脚本错误')+'（需要支持 WebGL2 的现代浏览器）';});
</script>
</body>
</html>
